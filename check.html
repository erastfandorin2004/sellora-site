<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Проверка доступа</title>
<style>
:root{--bg:#f6f6f3;--card:#fff;--ink:#14161a;--mute:#6b7076;--ok:#1f9d55;--bad:#d64545;--wait:#b0b4b9;--line:#e6e6e1}
@media (prefers-color-scheme:dark){:root{--bg:#0f1113;--card:#181b1f;--ink:#f1f2f3;--mute:#8d939a;--line:#262a2f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,system-ui,Segoe UI,Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:22px;margin:0 0 4px}p.sub{color:var(--mute);margin:0 0 20px;font-size:14px}
.row{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--wait);margin-top:5px;flex:none}
.ok .dot{background:var(--ok)}.bad .dot{background:var(--bad)}
.name{font-weight:600}.info{color:var(--mute);font-size:13px;word-break:break-word}
.sum{margin-top:16px;padding:14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:600}
button{margin-top:16px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--ink);color:var(--bg);font-size:16px;font-weight:600}
</style>
</head>
<body>
<main>
<h1>Проверка доступа из России</h1>
<p class="sub">Откройте страницу и подождите 10–20 секунд. Сделайте скриншот результата.</p>
<div id="list"></div>
<div class="sum" id="sum">Проверяем…</div>
<button onclick="run()">Проверить ещё раз</button>
</main>
<script>
const SB = "https://ghrttrgiqijerqwdbklx.supabase.co";
const KEY = "sb_publishable_QraCmH18H6cp4Tgw0kKDvA_Dezeq5FM";
const checks = [
  {id:"ip", name:"Ваша страна (IP)", run: async s => {
    const r = await tfetch("https://api.country.is/", {}, s); const j = await r.json(); return "страна: " + j.country + ", IP " + j.ip; }, info:true},
  {id:"gh", name:"Сайт на GitHub Pages", run: async s => {
    const r = await tfetch(location.origin + "/sellora-site/?t=" + Date.now(), {}, s); return "HTTP " + r.status; }},
  {id:"auth", name:"Supabase — вход в аккаунт", run: async s => {
    const r = await tfetch(SB + "/auth/v1/health", {headers:{apikey:KEY}}, s); return "HTTP " + r.status; }},
  {id:"db", name:"Supabase — база (баланс, цены)", run: async s => {
    const r = await tfetch(SB + "/rest/v1/", {headers:{apikey:KEY}}, s); return "HTTP " + r.status + " (любой ответ = доступно)"; }},
  {id:"fn", name:"Supabase — функция оплаты LAVA", run: async s => {
    await tfetch(SB + "/functions/v1/lava-checkout", {mode:"no-cors"}, s); return "сервер ответил"; }},
  {id:"lava", name:"Страница оплаты LAVA", run: async s => {
    await tfetch("https://app.lava.top/", {mode:"no-cors"}, s); return "сервер ответил"; }},
  {id:"google", name:"Вход через Google", run: async s => {
    await tfetch("https://accounts.google.com/generate_204", {mode:"no-cors"}, s); return "сервер ответил"; }},
  {id:"apiyi", name:"Генерация (Apiyi)", run: async s => {
    await tfetch("https://api.apiyi.com/", {mode:"no-cors"}, s); return "сервер ответил"; }},
];
function tfetch(url, opt, signal){ return fetch(url, Object.assign({cache:"no-store", signal}, opt)); }
function render(){
  document.getElementById("list").innerHTML = checks.map(c =>
    `<div class="row" id="r-${c.id}"><div class="dot"></div><div><div class="name">${c.name}</div><div class="info" id="i-${c.id}">проверяем…</div></div></div>`).join("");
}
async function one(c){
  const row = document.getElementById("r-"+c.id), info = document.getElementById("i-"+c.id);
  const ctl = new AbortController(); const timer = setTimeout(()=>ctl.abort(), 12000); const t0 = performance.now();
  try { const msg = await c.run(ctl.signal); row.className = "row ok"; info.textContent = msg + " · " + Math.round(performance.now()-t0) + " мс"; return true; }
  catch(e){ row.className = "row bad"; info.textContent = (e.name==="AbortError" ? "нет ответа за 12 секунд" : "не открывается") + " · " + (e.message||e); return false; }
  finally { clearTimeout(timer); }
}
async function run(){
  render(); document.getElementById("sum").textContent = "Проверяем…";
  const res = await Promise.all(checks.map(one));
  const bad = checks.filter((c,i)=>!res[i] && !c.info).map(c=>c.name);
  document.getElementById("sum").textContent = bad.length ? "Не открылось: " + bad.join(", ") : "Всё открывается ✓";
}
run();
</script>
</body>
</html>
